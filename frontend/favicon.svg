<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Groundtruth">
  <title>Groundtruth</title>
  <!-- Clay ground, paper letterform: the app's own two colours, never a
       status colour. Red, amber and green belong to the species. -->
  <rect width="64" height="64" rx="14" fill="#c67139"/>
  <!-- The G is a path, not text. An SVG favicon cannot load a webfont, so a
       <text> element would render as whatever serif each visitor's OS
       happens to have. A monoline stroke with round terminals also survives
       16px far better than a display serif's thin strokes would. -->
  <path d="M41.2 18.9 A16 16 0 1 0 47.9 33.4 L34 33.4"
        fill="none"
        stroke="#f5ead8"
        stroke-width="9.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
